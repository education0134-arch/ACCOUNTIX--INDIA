<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ACCOUNTIX INDIA Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="top"><a class="brand" href="/">ACCOUNTIX <span>INDIA</span></a><nav><a href="/">View Website</a></nav></header>
<main class="section"><div id="loginBox" class="item" style="max-width:520px;margin:auto"><p class="eyebrow">OWNER ACCESS</p><h2>Admin Login</h2><p>Only the configured owner email and phone can request OTPs.</p><label>Admin email</label><input id="email" type="email" placeholder="owner@example.com"><label>Admin phone (international format)</label><input id="phone" placeholder="+91XXXXXXXXXX"><button class="btn" id="request">Send OTP</button><div id="otpFields" hidden><label>Email OTP</label><input id="emailCode" inputmode="numeric" maxlength="6"><label>Phone OTP</label><input id="phoneCode" inputmode="numeric" maxlength="6"><button class="btn" id="verify">Verify & Login</button></div><p id="loginMsg"></p></div>
<div id="dashboard" hidden><p class="eyebrow">CONTROL PANEL</p><h1 style="font-size:42px">Admin Dashboard</h1><div id="stats" class="grid"></div><div class="section-head"><h2>Manage services</h2><button class="btn" onclick="newService()">+ Add service</button></div><div id="servicesAdmin" class="grid"></div><div class="section-head"><h2>Manage courses</h2><button class="btn" onclick="newCourse()">+ Add course</button></div><div id="coursesAdmin" class="grid"></div><div class="item"><h2>Ads & Affiliate Settings</h2><label>AdSense publisher ID (ca-pub-...)</label><input id="adsense"><button class="btn" onclick="saveSettings()">Save settings</button></div><div class="item"><h2>Recent activity</h2><div id="activity"></div></div><div class="item"><h2>Comments moderation</h2><div id="commentsAdmin"></div></div><button class="btn secondary" onclick="logout()">Logout</button></div>
</main><script src="/admin.js"></script></body></html>
